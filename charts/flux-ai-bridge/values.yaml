affinity: {}

autoscaling:
  enabled: false
  maxReplicas: 3
  minReplicas: 1
  targetCPUUtilizationPercentage: 80
  # Optional second HPA metric; unset = CPU only.
  # targetMemoryUtilizationPercentage: 80

# ─── flux-ai-bridge configuration ────────────────────────────────────────────
config:
  # ─── Dedupe cache (admission filter) ───────────────────────────────────
  # The dedupe cache prevents the bridge from running the same expensive
  # pipeline twice for events that represent the same situation. Flux's
  # notification-controller re-fires events on every reconcile pass —
  # typically once every 5 min for the Kustomization. Without dedupe, every
  # one of those would burn an LLM call + GitHub round-trip, producing
  # identical analyses for an unchanged cluster state.
  dedupe:
    # Optional persistent storage for the dedupe cache (Redis protocol —
    # works with the bundled valkey sub-chart below, an external Valkey,
    # or any Redis-compatible service like AWS ElastiCache / GCP
    # Memorystore).
    #
    # Enabled by default, with the bundled Valkey (valkey.enabled). It keeps
    # the PR label roster across restarts, which the flux-* label aggregation
    # needs to be correct, and spares re-running analyses (and LLM calls)
    # after a restart. For in-memory dedupe, set this and valkey.enabled to
    # false: bridge restarts then wipe it, and the first event after a restart
    # for an already-handled SHA re-runs the pipeline. With an external
    # Redis/Valkey, keep this on and set url (or sentinel) with
    # valkey.enabled=false.
    persistence:
      # ─── HA: multi-replica via persistent dedupe (active-active) ─────────────────
      #
      # replicaCount > 1 (or autoscaling.enabled) requires persistent dedupe. All
      # replicas share that one store, so for high availability the store must
      # be highly available too: with the bundled Valkey, use its Sentinel
      # setup (see the valkey section), not the single-pod default. The
      # chart enforces this at template time — `helm install` fails fast with a
      # clear error if you try to scale up without dedupe persistence enabled.
      #
      # How coordination works at runtime:
      #   - Every replica accepts every webhook (Service round-robins normally;
      #     all pods stay 1/1 Ready so no alerts fire).
      #   - After resolving an event's PRs, the processor calls SETNX against
      #     Redis/Valkey once per (Kustomization, PR, PR head commit). SETNX is
      #     atomic across pods, so exactly ONE replica wins each PR head and
      #     runs the readiness poll + LLM + GitHub delivery for it. The others
      #     skip that PR (prs_skipped_total{reason="deduped"}) — no LLM call,
      #     no comment.
      #   - If the winner's pipeline fails, it releases its marks so a retry
      #     event can be admitted by any replica (after a GitHub rate limit,
      #     only once the limit has reset).
      #
      # Wire it up via either:
      #   - valkey.enabled=true  + config.dedupe.persistence.enabled=true  (bundled)
      #   - config.dedupe.persistence.{url,enabled}=...                    (external)
      # See the `valkey:` and `config.dedupe.persistence:` sections elsewhere
      # in this file.
      enabled: true
      # Reference an existing Secret with the dedupe password instead
      # of storing it in chart values. Use passwordKey below to point at
      # the right entry when consuming a third-party Secret (e.g. one
      # provisioned by an external-secrets operator) without renaming
      # its keys. In sentinel mode this Secret can also carry the
      # sentinel-daemon password under sentinel.passwordKey.
      existingSecret: ""
      # Backstop expiry (env DEDUPE_PERSISTENCE_MAX_TTL) for Redis records
      # that would otherwise never expire: admission marks when reEval.ttl is
      # unset, outcome/label records, and the fetch cache's immutable entries
      # (blobrefs:, pr-files:, last-comment:, …). Without it they accumulate
      # for every PR-head ever seen. The cost: a PR-head Flux still re-fires
      # after this long is analysed once more. Empty = bridge default 720h
      # (30 days); "0" disables the backstop.
      maxTTL: ""
      # Optional password. Set when your external Redis/Valkey has auth
      # on. The bundled valkey sub-chart ships with auth disabled by
      # default. Stored inline here for `helm template` simplicity;
      # rotate via existingSecret for production.
      password: ""
      # Key inside existingSecret holding the (Redis backend) password.
      # Default matches the bridge env var so users with chart-shaped
      # Secrets keep working unchanged. Set to "" to disable password
      # injection entirely (username-only ACL flows where auth is done
      # with `user` only).
      passwordKey: "DEDUPE_PERSISTENCE_PASSWORD"

      # ─── Redis Sentinel (HA) ────────────────────────────────────────
      # When sentinel.enabled=true the bridge uses go-redis's
      # FailoverClient: it connects to the sentinel quorum, discovers the
      # current Redis master via `SENTINEL get-master-addr-by-name`, and
      # follows master failover automatically. This is the only supported
      # path for HA — pointing the single-node `url` field at a specific
      # master pod will break the moment sentinel promotes a new master.
      #
      # The single-node `url` field is ignored when sentinel mode
      # is enabled; sentinel.* fully supersedes it.
      #
      # Bitnami's redis chart and the various managed Sentinel offerings
      # ship Sentinel and Redis with INDEPENDENT ACL files — so the
      # bridge needs two credential pairs:
      #   user / password                 → Redis master+replicas
      #                                     (the backend that actually
      #                                     stores dedupe entries)
      #   sentinel.user / sentinel.password → the sentinel daemons
      #                                       themselves
      # In practice the values are often identical; the chart lets you
      # set them independently so you don't have to.
      sentinel:
        # Sentinel quorum addresses, passed straight to go-redis's
        # FailoverClient. Sentinel tracks individual pods, not a
        # load-balancer VIP, so DON'T point this at a normal ClusterIP
        # Service (it would only ever return one IP and defeat the
        # quorum). Two idiomatic forms:
        #
        #   1. The Redis chart's HEADLESS Service (clusterIP: None) — its
        #      DNS returns every sentinel pod, so a single entry suffices:
        #        "redis-flux-ai-bridge-headless.flux-system.svc.cluster.local:26379"
        #
        #   2. An explicit comma-separated list of per-pod FQDNs, for
        #      maximum robustness (the client knows every quorum member up
        #      front rather than relying on DNS re-resolution):
        #        "redis-node-0.redis-headless.ns.svc.cluster.local:26379,redis-node-1.redis-headless.ns.svc.cluster.local:26379,redis-node-2..."
        #
        # The sentinel port lives in each addr (":26379" is the Bitnami /
        # canonical default), so it's configurable here without a separate
        # field. Required when enabled.
        # With the bundled Valkey in Sentinel mode (valkey.replica.enabled +
        # valkey.sentinel.enabled), empty means its Sentinel headless Service.
        addrs: ""
        # Logical Redis database (SELECT <n>). 0 unless you cohabit with
        # other workloads on the same Redis cluster.
        db: 0
        # Sentinel mode, for an external Sentinel cluster or the bundled
        # Valkey. With valkey.enabled=true it requires the bundled Valkey to
        # run Sentinel itself (valkey.replica.enabled, valkey.sentinel.enabled,
        # plus valkey.persistence and valkey.sentinel.password, set to the same
        # value as `password` below); the chart refuses the mix otherwise.
        # The reverse is enforced too: a bundled Valkey running Sentinel
        # balances its data Service across master and replicas, so the bridge
        # must use Sentinel mode there.
        enabled: false
        # Name configured in the sentinel `sentinel monitor <name> …`
        # line. Bitnami's default is "mymaster"; if you provisioned the
        # cluster by hand it's whatever you chose. Required when enabled.
        # With the bundled Valkey in Sentinel mode, empty means its
        # valkey.sentinel.masterSet ("mymaster").
        masterName: ""
        # Sentinel-daemon ACL password (inline). Stored in the chart-
        # created Secret as DEDUPE_PERSISTENCE_SENTINEL_PASSWORD, or
        # consumed from existingSecret via sentinel.passwordKey.
        password: ""
        # Key inside the existing Secret holding the sentinel password.
        # Empty (default) means: don't mount a sentinel password, even
        # in sentinel mode — appropriate when your quorum is
        # unauthenticated. Set to the actual key name in your BYO
        # Secret (e.g. "sentinel-password") to wire it in.
        passwordKey: ""
        # Enable TLS on both the sentinel and master connections. The
        # bridge uses the system trust store; mount your own CA into the
        # pod (volumeMounts) when the cluster issues certs from a
        # private CA.
        tls: false
        # Sentinel-daemon ACL username, plaintext. Same rationale as
        # the parent `user` field — usernames aren't secret.
        user: ""
      # Connection URL (redis://host:port/db or rediss:// for TLS). When
      # valkey.enabled=true AND this is empty, the chart auto-derives it
      # from the in-cluster Valkey Service. Set explicitly for external
      # services. Example: redis://valkey.cache.svc.cluster.local:6379/0
      url: ""
      # Optional Redis ACL username (Redis 6+). Leave empty for the legacy
      # "default" user (which is what plain `password`-only auth selects).
      # Use this when your managed Redis/Valkey enforces per-user ACLs and
      # the bridge needs to authenticate as a specific user. Injected as a
      # plain pod env var — the username is not a secret and lives
      # alongside the URL regardless of whether the password is sourced
      # from existingSecret or inline.
      user: ""
    # Per-PR-head RE-EVALUATION controls.
    reEval:
      # failedOnly (env DEDUPE_REEVAL_FAILED_ONLY) narrows re-evaluation to
      # PR-heads whose LAST analysis was NOT healthy. Only consulted when ttl is
      # set. Default true: a previously-green head is FROZEN — never re-analysed
      # until the PR gets a new commit (a new head SHA) — while a failed/warning
      # one is re-checked each window so a later fix (or a worsening) is picked
      # up. This is almost always what you want: re-eval exists to track
      # failures resolving, and re-polling healthy deploys is pure cost.
      #
      # NOTHING re-wakes a frozen green head — not a Flux error event, not a
      # pod that starts crashing afterwards. In a monorepo where many open PRs
      # share a Kustomization, re-waking green heads on ANY failure in that
      # Kustomization flipped unrelated green PRs to a failure label whenever a
      # SIBLING change broke something. The deliberate trade-off: genuine drift
      # on a green deploy (a pod that dies minutes after a green analysis) is
      # NOT reflected until the PR is pushed again. Collateral damage from the
      # PR's OWN change is still caught — the FIRST analysis is whole-inventory,
      # so a PR only reaches green if every dependent resource was healthy then.
      #
      # Set to false to re-evaluate EVERY attributed PR-head each window
      # regardless of prior outcome — this DOES re-check green heads (catching
      # post-green drift), at the price of re-polling everything every window
      # AND flipping green PRs when unrelated siblings in the same Kustomization
      # break.
      failedOnly: true
      # maxRetries (env DEDUPE_PR_REEVAL_MAX) caps how many re-evaluations a
      # single PR-head gets. Only consulted when ttl is set. Default 0 =
      # unlimited: a deploy that stays broken forever is re-polled (readiness +
      # LLM + comment refresh) EVERY window for as long as the PR lives. Set a
      # positive count (e.g. 8) to stop re-evaluating a head once its budget is
      # spent — the head then stops TRIGGERING analyses until a new commit
      # lands (a new head always starts with a fresh budget). It still
      # piggybacks on analyses other PRs of the same Kustomization trigger, so
      # its comment tracks the current verdict at zero extra analysis cost;
      # with no siblings it freezes at the last analysis. The budget caps
      # CONSECUTIVE failing re-evals, not the head's lifetime: healthy skips
      # don't count, and the counter self-cleans after ~two windows without
      # increments — a head that drifts unhealthy days later still gets a
      # fresh analysis and a new budget. Skips are
      # visible as flux_ai_bridge_prs_skipped_total{reason="reeval_exhausted"}.
      # Only re-evals whose ANALYSIS concludes failed/warning count: healthy
      # skips (failedOnly) and re-evals that conclude healthy are both free —
      # a recovery is the news re-eval exists for. With ttl 15m and maxRetries 8, a broken PR costs at
      # most ~2h of re-polling per push, instead of polling until it's closed.
      maxRetries: 0
      # ttl is the re-evaluation floor (env DEDUPE_PR_REEVAL_TTL). By default
      # ("" / unset → 0) the bridge analyses each PR exactly ONCE per its head
      # commit: a Flux reconcile that re-fires for an unchanged PR is skipped
      # ("PR already analysed at this head"), so the comment is NOT refreshed.
      # That means RUNTIME DRIFT — a pod that starts crashlooping minutes after
      # an initially-green deploy — is never reflected, because the PR head
      # hasn't changed.
      #
      # Set a positive duration (e.g. "30m" or "1h") to let that admission
      # expire, so a later reconcile re-admits the PR, re-polls the cluster, and
      # updates the comment if state changed (idempotent — unchanged state writes
      # nothing). The trade-off is cost: each PR re-runs the readiness poll + LLM
      # + GitHub write once per window. Pick a value balancing freshness vs that.
      # The bridge refuses a value shorter than one analysis
      # (config.readiness.pollTimeout + 2m, so 5m with the defaults).
      #
      # Enabling this on a RUNNING install also applies to PRs analysed before
      # the change: their existing admission records get the expiry attached on
      # their next Flux event, so pre-existing PR comments start refreshing
      # within roughly two windows — no new commit or manual cache flush needed.
      # NOTE: this migration of pre-existing records uses `EXPIRE ... NX` and
      # therefore needs Redis >= 7.0 on the persistence backend. Any Valkey
      # version qualifies (Valkey forked from Redis 7.2), including the bundled
      # sub-chart. On older Redis the bridge logs a warning and only PR-heads
      # analysed AFTER enabling the ttl re-evaluate.
      ttl: ""
    # Expiry of the IN-MEMORY dedupe entries (one per Kustomization, PR and
    # PR head commit); ignored when persistence is enabled (see
    # persistence.maxTTL for Redis). Three modes:
    #   - ""   (default) → no expiry. An entry is held until evicted by the
    #                       LRU bound, a pipeline-error rollback, or a pod
    #                       restart. Matches the bridge's event-driven
    #                       contract: a PR head is analysed once.
    #   - "0"            → dedupe disabled entirely. Every event runs the
    #                       pipeline. Not allowed with github.labels.enabled
    #                       unless persistence is on: label aggregation
    #                       needs the dedupe record.
    #   - positive dur.  → TTL-bounded. Useful for "give me a refresh post
    #                       once a day" — e.g. "24h" or "1h". Go duration
    #                       syntax.
    ttl: ""

  # ─── Failure-context fetching ──────────────────────────────────────────
  # Extra context the bridge fetches on error-severity Flux events. Each
  # toggle adds one MCP round-trip and ~1-8k prompt tokens (failure path
  # only — happy-path events are unaffected).
  failureAnalysis:
    # Fetch recent K8s events in the Kustomization's namespace — usually the
    # highest-signal source for "what went wrong" (ImagePullBackOff, OOMKill,
    # FailedScheduling, etc.).
    fetchEvents: true
    # Fetch the Flux Operator's own status. Off by default — useful only
    # for cluster-wide Flux problems, not per-Kustomization failures.
    fetchFluxInstance: false
    # Fetch logs from up to 3 failing workloads' pods (last 100 lines each).
    fetchLogs: true
    # Fetch resource metrics for the failing workloads. Off by default —
    # raw CPU/mem numbers are hard for the LLM to interpret without context.
    fetchMetrics: false
    # Which failing pods' logs are fetched (FAILURE_FETCH_LOGS_SCOPE):
    # "owned" (default) only pods owned by a workload in the Kustomization's
    # inventory, so logs of unrelated apps in a shared namespace never reach
    # the LLM; "namespace" any failing pod in the swept namespaces (the
    # behaviour before this setting existed). Other values fail startup.
    logsScope: owned

  # ─── GitHub target + API endpoint ──────────────────────────────────────
  github:
    # Accept a plain-HTTP apiUrl (env GITHUB_API_ALLOW_INSECURE). The bridge
    # refuses an http:// URL by default, as it would send the GitHub App JWT
    # and installation tokens unencrypted. Only for an in-cluster test mock.
    allowInsecure: false
    # Override the GitHub API base URL (useful for GitHub Enterprise or
    # testing). Leave empty to use the default github.com API endpoint.
    apiUrl: ""
    # GitHub fetch-cache tuning. The fetch cache is what keeps the bridge
    # under GitHub's API rate limit; these knobs trade a little
    # freshness/depth for fewer calls. All optional — empty = bridge default.
    cache:
      # In-memory LRU capacity in entries (env FETCH_CACHE_CAPACITY, default
      # 4096), shared across all fetch-cache kinds. Ignored when the
      # fetchcache is Redis-backed (auto-detected from persistent dedupe).
      capacity: ""
      # Growth bound on the immutable commit-parents cache (env COMMIT_TTL,
      # default 1h). A negative duration (e.g. "-1s") restores no-expiry.
      commitTTL: ""
      # TTL for the per-commit PR-lookup cache (env PRS_FOR_COMMIT_TTL,
      # default 5m). Raise (e.g. "15m") to cut how often the parent walk
      # re-validates PR state on a busy repo. Empty/"0" → the 5m default; set a
      # NEGATIVE duration (e.g. "-1s") to disable this cache (blob + commit
      # caches stay on).
      prsForCommitTTL: ""
    # Comment behaviour.
    comments:
      # failedResourcesOnly compacts BOTH the "## Resource Status" and
      # "## Workload Status" tables for large inventories / pod-heavy namespaces.
      # When true: a section with failures lists only the failing (non-Current)
      # rows; a section where everything is Current collapses to a single compact
      # row keyed by the Kustomization. The overall ✅/⚠️/❌ marker + summary still
      # reflect the FULL inventory/pod set — only the table rows are filtered.
      # Default true (compact); set false for full per-resource/per-pod tables.
      failedResourcesOnly: true
      # includeFooter: the trailing "*Analyzed by flux-ai-bridge*" attribution
      # line on every comment. Default true. Set false to strip it; the
      # per-Kustomization HTML marker `<!-- flux-ai-bridge:<ns>/<name> -->` still
      # scopes the delete-prior behaviour.
      includeFooter: true
      # includeSummary: the optional headline summary line at the top of the
      # comment body — e.g. "All N inventory resource(s) reached kstatus Current."
      # Default true: a one-glance verdict above the tables (and, on healthy
      # outcomes, the kstatus README link). Set false to jump straight from the
      # marker to the Resource Status table. Applies with and without an LLM:
      # the bridge writes this line; the model's narrative goes below the tables.
      includeSummary: true
      # keepHistory: when true, each analysis is posted as a NEW comment without
      # deleting prior bridge comment(s) — the PR accumulates a chronological
      # trail (handy to watch a workload toggle healthy/broken across commits, or
      # for an audit trail). Default false keeps the "exactly one current comment
      # per PR" idempotency story. See docs/architecture.md.
      keepHistory: false
      # onSuccess controls whether a comment is posted on a HEALTHY outcome
      # (everything Current, settled). Default true. Set false to suppress the
      # "all green" comment entirely — warnings and failures still get one.
      # INDEPENDENT of labels.enabled: a common setup is `onSuccess: false` +
      # `labels.enabled: true`, so healthy PRs get the success label (which a
      # merge gate keys on) with no comment noise; only problem PRs get a written
      # comment. When a healthy comment is suppressed but the PR still carries a
      # bridge comment from an earlier failing run, that stale comment is removed
      # (cache-guarded — at most one comment lookup per PR and Kustomization
      # when the cache has no record, none after that).
      # Suppressing also skips the LLM call on healthy outcomes.
      onSuccess: true
    # Outcome-driven PR labels — a merge gate can key on them. Reconciled on
    # every PR the bridge processes, independent of whether a comment was posted
    # (so `comments.onSuccess: false` + `labels.enabled: true` labels healthy PRs
    # without commenting). Requires GitHub App `Issues: Read & Write` — the same
    # permission comments already need.
    #
    # Multi-Kustomization PRs: the label reflects the AGGREGATE across every
    # Kustomization attributed to the PR —
    #   - ANY attributed Kustomization failing → the failed label
    #   - ALL of them healthy                  → the success label
    #   - otherwise (a warning, none failed)   → the warning label
    #   - none left (PR no longer touches any) → all bridge labels removed
    # so a later healthy event for one Kustomization can't flip the PR green
    # while another is still broken. (Aggregation needs the persistent dedupe
    # cache to be correct across replicas — see config.dedupe.persistence;
    # without it, it degrades to per-Kustomization last-write-wins.)
    labels:
      # Master switch. Default false — opt-in feature.
      enabled: false
      # Label names to apply. Defaults below. Whatever you choose becomes the
      # contract your merge gate keys on, so changing them later silently breaks
      # branch-protection rules — treat as a contract once set.
      #
      # Set `warning` to the SAME value as `failed` to make a ⚠️ warning outcome
      # (settle-timeout, in-progress, or a Flux child stuck on BuildFailed that
      # kstatus reports as InProgress) apply the failed label too — i.e. a merge
      # gate keyed on the failed label blocks on ANY non-green outcome. The
      # bridge never removes a label it's also adding, so the shared name is safe
      # (no churn). The comment marker is unaffected (a warning still renders ⚠️).
      names:
        failed: flux-failed
        success: flux-success
        warning: flux-warning
    # Cap on the merge-parent walk in FindPRsForCommit (env
    # PARENT_WALK_DEPTH). Empty = bridge default (200). The walk normally
    # stops earlier, at the merge base with the default branch; the cap
    # bounds it when that can't be determined. Raise it if your autodev
    # (https://github.com/Staffbase/autodev-action) batches merge more PRs
    # than this in one push. See docs/caching.md.
    parentWalkDepth: ""
    # GitHub repository in "owner/repo" format.
    # Optional: auto-discovered from the Flux GitRepository spec.url when
    # left empty.
    repo: ""
  # Instance ID (env INSTANCE_ID) for running bridges in several clusters
  # against the same repositories. It goes into every comment marker and the
  # Redis key prefixes, so each instance keeps its own comment per
  # Kustomization and its own dedupe/cache state. PR labels can't be scoped
  # this way — give each instance its own config.github.labels.names, or the
  # instances overwrite each other's verdict. A DNS label (lowercase letters,
  # digits, '-'). Empty = single instance; existing comments keep matching.
  # Changing it later orphans the comments posted under the old value.
  instanceId: ""

  # ─── Kustomization admission filter ────────────────────────────────────
  # Glob lists (Go path.Match syntax — `*`, `?`, `[abc]`) selecting which
  # Kustomization NAMES the bridge processes. Filtering happens in-process,
  # AFTER the Flux Alert delivers the event but BEFORE dedupe — so dropped
  # events never pollute the dedupe cache.
  #
  # Compose rule (mirrors Prometheus relabel keep+drop, kustomize, gitignore):
  #   - Both empty                → admit everything (default).
  #   - Non-empty include         → name MUST match at least one include glob.
  #   - Non-empty exclude         → name MUST NOT match any exclude glob.
  #   - Both populated            → match include AND not match exclude
  #                                 (deny wins). e.g. include=[apps-*],
  #                                 exclude=[apps-canary] admits apps-frontend,
  #                                 drops apps-canary, drops infra-cert-manager.
  #
  # Bad globs (e.g. unclosed `[`) make the bridge exit non-zero at startup,
  # and empty patterns fail the chart render — typos are caught at deploy
  # time, not silently absorbed at runtime.
  #
  # Drops emit a DEBUG log line and increment the
  # flux_ai_bridge_events_filtered_total{reason="not_in_include"|"in_exclude"}
  # counter. Use that counter (not log grep) to verify the filter is doing
  # what you expect.
  kustomizations:
    exclude: []
    # Examples:
    # include:
    #   - "apps-*"
    # exclude:
    #   - "apps-canary"
    #   - "infra-*"
    include: []

  # ─── LLM provider, model + endpoints ───────────────────────────────────
  llm:
    # Override the Anthropic API base URL (useful for testing with a mock
    # server). Leave empty to use the default Anthropic API endpoint.
    anthropicBaseUrl: ""
    # Hard cap on LLM output tokens. Empty = bridge default (2048).
    # If a response is truncated, the bridge logs WARN and increments
    # flux_ai_bridge_llm_max_tokens_hit_total — alert on that to know if
    # 2048 is too tight.
    maxTokens: ""
    # LLM model override.
    # Defaults: claude → claude-sonnet-4-6 | openai-compatible → gpt-4.1
    model: ""
    # Override the OpenAI-compatible API base URL (only used when
    # provider=openai-compatible). Useful to point at a local OpenAI-
    # compatible server such as Ollama (http://ollama.../v1) for e2e tests.
    # Leave empty to use the default Azure model-inference endpoint.
    # When ollama.enabled=true (see below, opt-in) AND this is empty, the
    # chart auto-derives it from the bundled Ollama Service.
    openaiBaseUrl: ""
    # LLM provider to use.
    # Supported values: "none", "claude", "openai-compatible"
    #
    # Default is "none" — the bridge posts a deterministic comment built
    # from the kstatus output alone
    # (https://github.com/kubernetes-sigs/cli-utils/tree/master/pkg/kstatus).
    # No API key, no model, no skill prompt. A fresh `helm install` with
    # only GitHub App credentials produces a working bridge that posts
    # structured readiness tables on every Flux event. Suitable for
    # air-gapped clusters, cost-sensitive setups, or as a starting point.
    #
    # Switch to "claude" (+ credentials.anthropicApiKey) for an LLM-written
    # summary on top of the kstatus table. Recommended for production
    # quality.
    #
    # Switch to "openai-compatible" (+ credentials.openaiApiKey +
    # llm.openaiBaseUrl) to use Azure OpenAI Service, OpenAI proper,
    # OpenRouter, vLLM, or a local Ollama (see ollama.enabled below for
    # the bundled self-contained option).
    provider: "none"
    # Short-circuit the LLM call when the cluster is fully green: every
    # inventory row reached `Current`, every pod (when includePods=true)
    # reached `Current`, and the readiness poll settled cleanly. Comment
    # shape stays byte-identical to the LLM-driven happy-path output — the
    # same kstatus body the LLM_PROVIDER=none path produces fills in.
    #
    # Defaults to true so steady-state reconciles cost zero LLM tokens. Set
    # false when you've customized SKILL.md to add team-specific text on
    # healthy comments (runbook links, team tags) that the kstatus-only
    # body wouldn't carry, or simply want every reconcile annotated by the
    # model. Ignored when provider=none (no LLM to skip).
    skipOnHealthy: true
  # Log level: debug | info | warn | error.
  # Transverse — affects every code path rather than a single domain group.
  logLevel: ""

  # ─── flux-operator-mcp client ──────────────────────────────────────────
  mcp:
    # Maximum number of MCP sessions in the pool.
    # Empty = bridge default (matches webhook.maxConcurrent). With many
    # concurrent kustomization reconciliations, the bridge needs one
    # session per in-flight pipeline; otherwise all MCP calls serialize
    # through a single session.
    poolSize: ""
    # URL of the flux-operator-mcp HTTP MCP endpoint.
    # Empty = the bundled flux-operator-mcp sub-chart's Service in the release
    # namespace (http://flux-operator-mcp.<release-namespace>.svc.cluster.local:9090/mcp).
    # Required when flux-operator-mcp.enabled=false.
    url: ""

  # ─── PR admission filter ───────────────────────────────────────────────
  # After the SHA lookup returns candidate PRs, gate which ones receive a
  # comment by their GitHub labels. Combined with the always-on inventory
  # match (the bridge requires a PR to declare at least one resource that
  # this Kustomization manages — see processor.filterPRs), this lets
  # operators opt individual PRs into bridge review rather than commenting
  # on every PR a Kustomization happens to be part of. Particularly
  # important in autodev-style flows where one merge SHA can map to 10+
  # PRs via the SHA→PR parent walk.
  #
  # Semantics:
  #   - Empty (default) → no filter; every candidate PR is considered.
  #   - Non-empty       → PR must carry AT LEAST ONE of these labels.
  #                       Case-sensitive, exact match.
  #
  # Filter order in the processor:
  #   FindPRsForCommit → drop closed/merged → required-labels →
  #   inventory-membership (PR file YAML declares a resource in this
  #   Kustomization's status.inventory) → post. The labels gate runs
  #   BEFORE the per-PR ListPRFiles + GetBlobContent calls, so a PR
  #   missing the required label costs zero extra GitHub API spend.
  prFilter:
    # attributePrunes (PR_ATTRIBUTE_PRUNES, default true) — attribute a
    # pure-deletion PR by what the reconcile PRUNED, not only by what's currently
    # in status.inventory. A `removed` file whose declared resource the
    # Kustomization just deleted (read from the controller's prune event,
    # `Kind/namespace/name deleted`) attributes the PR even though the resource is
    # gone from the inventory — so a clean teardown reads flux-success, and
    # removing a whole Kustomization is attributed to the parent that pruned the
    # child CR. The failure floor is safe: a missed prune event just leaves the PR
    # unlabelled, never wrong. Set false to disable (inventory-membership only).
    attributePrunes: true
    requiredLabels: []
    # Example:
    # requiredLabels:
    #   - flux-review
    #   - needs-review
  # ─── Readiness polling after Flux events ──────────────────────────────
  # After an event arrives, poll the inventory until every resource
  # reaches a terminal kstatus (Current/Failed/Terminating) before
  # sending to the LLM. Without this, kustomize-controller's
  # ReconciliationSucceeded event fires the moment kubectl-apply returns —
  # long before pods have rolled — and the analysis sees stale or
  # in-flight state. Empty = bridge defaults (5s interval, 3m timeout).
  # Go duration syntax.
  readiness:
    # When true, walk every HelmRelease in the Kustomization's inventory
    # and fold its own `status.inventory.entries` into the readiness check.
    # Without this, a HelmRelease inventory row carries only an opaque
    # controller summary ("generation N vs observed N-1") — the actual
    # Deployments / Services / ServiceAccounts the chart released stay
    # invisible. With it, those child resources show up in the
    # `## Resource Status` table alongside the HelmRelease itself.
    #
    # One level only — nested HelmReleases (a HelmRelease whose chart
    # contains another HelmRelease CR) are NOT recursively expanded.
    # Costs one extra MCP fetch per HelmRelease in the inventory.
    expandHelmReleases: true
    # When true, take a kstatus snapshot of pods in the Kustomization's OWN
    # namespace (its spec.targetNamespace if set, else its name — e.g.
    # Kustomization "grafana" → the "grafana" namespace) and render a separate
    # "## Workload Status" section in the PR comment. NOT every inventory
    # namespace: a Kustomization can own resources (dashboards, alert-rules)
    # across 100+ namespaces while only running its workload in one, so the
    # scan is confined to that one namespace to avoid dumping the whole
    # cluster's unrelated pods. Each pod row is labeled with its workload
    # controller (Deployment / StatefulSet / DaemonSet / Job, resolved via
    # ownerReferences — Pod → ReplicaSet → Deployment chains traverse one
    # extra MCP hop so the user-facing controller is shown, not the
    # implementation-detail ReplicaSet). Useful when a controller (e.g.
    # HelmRelease) reports the inventory row as healthy but the underlying
    # pods are crashing — kstatus's pod check sees CrashLoopBackOff,
    # ImagePullBackOff, OOMKilled, Pending>2m, etc. immediately.
    #
    # The scan re-runs until every pod reaches a terminal kstatus (so a
    # just-rolled-out pod is waited out to Current rather than caught mid-roll)
    # and the namespace has stayed quiet for podQuietPeriod, or the shared
    # READINESS_POLL_TIMEOUT budget elapses. Pods are listed by
    # namespace, NOT filtered by ownership; if another Kustomization owns
    # workloads in that namespace those pods show up too. Disable in
    # shared-namespace environments where the noise outweighs the value.
    includePods: true
    # How long the namespace must stay quiet before settled pods count as
    # settled: no workload pod appearing (a new pod, or one recreated under
    # the same name) and none shutting down or disappearing. Counted from
    # the start of the readiness poll or the last such change, whichever is
    # later. Operators create their workload pods only after Flux applied
    # the custom resource, and kstatus reads such a resource Current as soon
    # as it exists, so without this window a PR can get flux-success before
    # the operator's pods exist. Job pods don't count; a Failed workload pod
    # (not a Job's) skips the window. Comes out of the pollTimeout budget and
    # must be shorter than it; a window the budget cuts short ends as a
    # warning. 0 disables.
    # Empty = bridge default (60s, or half of pollTimeout when that is under
    # 2m).
    podQuietPeriod: ""
    pollInterval: ""
    pollTimeout: ""
  # Total shutdown budget on SIGTERM (env SHUTDOWN_TIMEOUT): in-flight
  # pipelines get it minus a 10s unwind reserve to finish, then they are
  # cancelled and roll back the dedupe marks of PRs they didn't deliver.
  # Must stay below terminationGracePeriodSeconds, or the kubelet's SIGKILL
  # cuts the rollback short. Empty = bridge default 30s.
  shutdownTimeout: ""

  # ─── Webhook / HTTP server ──────────────────────────────────────────────
  webhook:
    # Maximum number of webhook events processed concurrently.
    # Empty = bridge default (16).
    maxConcurrent: ""

# Credentials placed into a Secret created by this chart.
# Ignored when existingSecret is set.
# WARNING: prefer existingSecret + external secret management in production.
#
# GitHub auth is via a GitHub App — set all three credentials.githubApp
# fields. See docs/github-app.md for App setup + required permissions.
credentials:
  anthropicApiKey: ""  # only required when config.llm.provider=claude
  # All three fields must be set together. Partial config fails at bridge
  # startup with a clear error. See docs/github-app.md.
  githubApp:
    appId: ""  # e.g. "12345"
    installationId: ""  # e.g. "67890"
    # The full PEM contents of the App's private key. Use --set-file when
    # bootstrapping by hand:  --set-file credentials.githubApp.privateKey=key.pem
    privateKey: ""
  # API key for the OpenAI-compatible LLM endpoint (Azure AI Foundry,
  # Azure OpenAI Service, OpenRouter, self-hosted vLLM, etc.). Only used when
  # config.llm.provider=openai-compatible. Leave empty when targeting Ollama
  # (no auth required).
  openaiApiKey: ""

# Reference an existing Secret instead of having the chart create one.
# The Secret must contain the keys: GITHUB_APP_ID, GITHUB_APP_INSTALLATION_ID,
# GITHUB_APP_PRIVATE_KEY, and (for claude) ANTHROPIC_API_KEY OR (for
# openai-compatible) OPENAI_API_KEY, unless extraEnv sets the API key. When
# set, the credentials section below is ignored.
existingSecret: ""

# Extra environment variables for the bridge container (Kubernetes EnvVar
# list), added after the chart's own. Kubernetes gives env priority over
# envFrom, so an entry here overrides the same key from the credentials
# Secret. Use it to read a key from a Secret of its own, e.g. an LLM API key
# that is managed and rotated apart from the GitHub App credentials:
#
#   extraEnv:
#     - name: OPENAI_API_KEY
#       valueFrom:
#         secretKeyRef:
#           name: <llm-secret>
#           key: <key>
#
# Don't repeat a name the chart already sets. Like existingSecret, a Secret
# referenced here needs a reloader to restart the pod when it changes.
extraEnv: []

# Flux Notification Controller integration.
# When enabled, creates a Flux Provider and Alert that point to the bridge webhook,
# so the Notification Controller automatically forwards Kustomization events.
#
# Enabled by default — without it the bridge has no event source. Set it to
# `false` on clusters without Flux's notification-controller, or when you
# manage the Provider and Alert yourself. The chart-testing values file
# charts/flux-ai-bridge/ci/no-flux-values.yaml installs the chart that way
# (the `-values.yaml` suffix is required — `ct install` globs
# `ci/*-values.yaml` and silently skips anything else).
flux:
  notification:
    enabled: true
    # Extra namespaces whose Kustomizations the Alert subscribes to. The Alert
    # always covers its own namespace; Kustomizations elsewhere are only seen
    # when listed here. Requires notification-controller to allow cross-
    # namespace references (it does unless run with --no-cross-namespace-refs).
    eventSourceNamespaces: []
    # HMAC-SHA256 signing of webhook payloads between Flux Notification Controller
    # and the bridge. Without it, any pod in the cluster network can POST fake
    # events to /webhook and trigger real LLM + GitHub API calls.
    #
    # On by default: the chart configures the Flux Provider as
    # `type: generic-hmac`, so notification-controller signs each webhook
    # (`X-Signature: sha256=<hex>`) with the token and the bridge validates it.
    #
    # Token source (first match wins):
    #   existingSecret: name of a Secret you manage yourself (BYO). It MUST
    #                   store the token under a key named `token` — both the
    #                   bridge and Flux's generic-hmac Provider read that exact
    #                   key (it is not configurable). The Secret must exist in
    #                   the release namespace AND in flux.notification.namespace
    #                   when that differs.
    #   token:          inline value; the chart creates the Secret(s) holding it
    #   generate: true  (default) the chart creates the Secret(s) with a random
    #                   token, reused on upgrades via `lookup`. Renderers without
    #                   cluster access (`helm template`, Argo CD) get a new token
    #                   on every render and the bridge restarts with it — use
    #                   token/existingSecret there.
    # Set generate: false with no token/existingSecret to disable signing
    # (Provider becomes `type: generic`; not recommended).
    #
    # How to create the token / Secret:
    #   # 1. generate a 32-byte random hex token (avoid a trailing newline):
    #   TOKEN=$(openssl rand -hex 32)
    #   # 2a. inline — just set `token: "<TOKEN>"` below; the chart makes the Secret. OR
    #   # 2b. BYO — create the Secret yourself (key MUST be `token`) and set
    #   #     existingSecret below:
    #   # (use --from-literal, NOT `echo | base64`, so there's no trailing \n —
    #   #  a stray newline makes the bridge's and Flux's tokens differ → every
    #   #  signature fails with "webhook signature verification failed".)
    hmac:
      existingSecret: ""
      generate: true
      token: ""
    # Namespace where the Flux Provider and Alert are created.
    # Defaults to the Helm release namespace.
    namespace: ""

fullnameOverride: ""

image:
  pullPolicy: IfNotPresent
  repository: ghcr.io/staffbase/flux-ai-bridge
  # Overrides the image tag. Defaults to the chart appVersion.
  tag: ""

imagePullSecrets: []

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3

# Read-only ClusterRole (get/list/watch on all resources) bound to the bundled
# flux-operator-mcp ServiceAccount. Wildcard because the bridge polls every
# object in a Kustomization's inventory, CRDs included; MCP masks Secret
# values by default. Set create: false to manage the binding yourself.
mcpRbac:
  create: true
  # The wildcard also grants `get` on nodes/proxy, which the kubelet accepts
  # for exec over WebSocket. excludeNodeProxy: true binds a role that lists
  # API groups instead, without nodes/proxy (and without pods/exec,
  # pods/attach, pods/portforward, pods/proxy, services/proxy): the core
  # resources incl. pods/log and events, the built-in groups (apps, batch,
  # networking, policy, autoscaling, rbac, apiextensions, …) and all Flux
  # groups. It MUST be extended for your CRDs via extraRules: a group it
  # misses shows up as unreadable resources in the PR comment.
  excludeNodeProxy: false
  # Extra rules added to the MCP role, e.g. for CRD groups with
  # excludeNodeProxy. verbs defaults to [get, list, watch]; any other verb
  # fails the render (the role stays read-only).
  #   extraRules:
  #     - apiGroups: ["example.com"]
  #       resources: ["*"]
  extraRules: []

nameOverride: ""

# NetworkPolicy lockdown for the bridge pod. On by default; it only takes
# effect where the CNI enforces NetworkPolicy (Cilium, Calico, recent kindnet,
# …) and is inert elsewhere. The bundled flux-operator-mcp has its own policy
# (flux-operator-mcp.networkPolicy below).
#
# Ingress:
#   - flux-system namespace by default (so the Notification Controller can POST)
#   - monitoring namespace when serviceMonitor.enabled=true
#   - networkPolicy.ingress.extra, appended
#   - networkPolicy.ingress.from replaces the flux-system source
#
# Egress:
#   - cluster DNS (pods labelled k8s-app: kube-dns in any namespace)
#   - flux-system namespace (source-controller artifacts; MCP if it runs there)
#   - pods in the release namespace (bundled flux-operator-mcp, Valkey, Ollama)
#   - bundled Ollama in ollama.namespaceOverride, when set
#   - external Redis/Valkey/Sentinel when config.dedupe.persistence is on
#     without the bundled Valkey (ports from networkPolicy.egress.redis, plus
#     any port written in the url / sentinel.addrs)
#   - the endpoints in config.llm.openaiBaseUrl / anthropicBaseUrl and
#     config.github.apiUrl, derived from the URL: an in-cluster Service
#     (<name>.<namespace>.svc…) allows its namespace on any port, an IP
#     address that address on the URL's port, any other host the URL's port
#     to any destination
#   - ports 443 and 6443 to anywhere (GitHub + LLM endpoints — NetPol can't
#     express FQDN allow-lists, use a CNI like Cilium with FQDN policies or an
#     egress proxy for stricter controls)
#
# Anything else needs networkPolicy.egress.extra — e.g. an endpoint set
# through extraEnv instead of the values above, an in-cluster Service named
# <name>.<namespace> without ".svc", or a DNS service with different labels.
networkPolicy:
  egress:
    # Extra egress rules appended verbatim. Use when the bridge needs to reach
    # additional in-cluster services (e.g., self-hosted Anthropic-compatible
    # gateway running outside flux-system or the release namespace).
    extra: []
    # External Redis/Valkey dedupe backend (config.dedupe.persistence enabled,
    # and bundled valkey disabled or overridden by persistence.url).
    # NetworkPolicy can't select hosts outside the cluster, so these ports are
    # opened to any destination. Ports written in persistence.url or
    # sentinel.addrs are opened as well.
    redis:
      # Data ports: the single-node server, or in Sentinel mode the master
      # Sentinel hands out (not known up front, so it must be listed here).
      ports:
        - 6379
      # Sentinel ports, opened in Sentinel mode only.
      sentinelPorts:
        - 26379
  enabled: true
  # Namespace label value used to select Flux's namespace for both ingress
  # (Notification Controller → bridge) and egress (bridge → MCP).
  fluxNamespace: flux-system
  ingress:
    # Example — also allow a separate test namespace:
    # from:
    #   - namespaceSelector:
    #       matchLabels:
    #         kubernetes.io/metadata.name: flux-system
    #   - namespaceSelector:
    #       matchLabels:
    #         kubernetes.io/metadata.name: e2e
    # Extra ingress rules appended verbatim (standard NetworkPolicy ingress
    # rules: from + ports). Unlike `from`, they add to the default rules —
    # e.g. a debugging namespace or a gateway that forwards webhooks:
    # extra:
    #   - from:
    #       - namespaceSelector:
    #           matchLabels:
    #             kubernetes.io/metadata.name: tools
    #     ports:
    #       - protocol: TCP
    #         port: 8080
    extra: []
    # Replace the default flux-system ingress rule with a custom `from:` list.
    # Each entry uses the standard NetworkPolicyPeer schema (namespaceSelector,
    # podSelector, ipBlock).
    from: []
  # Namespace label value used to allow Prometheus scrapes when
  # serviceMonitor.enabled=true.
  monitoringNamespace: monitoring

nodeSelector: {}

podAnnotations: {}

podLabels: {}

podSecurityContext:
  fsGroup: 65532
  runAsNonRoot: true
  runAsUser: 65532

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5
  timeoutSeconds: 3

replicaCount: 1

# Requests are set so the pod isn't BestEffort and an HPA on CPU/memory has a
# baseline to compute utilization against. No CPU limit; add a memory limit
# that fits your workload.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  # limits:
  #   memory: 256Mi

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  privileged: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  seccompProfile:
    type: RuntimeDefault

service:
  port: 8080
  type: ClusterIP

serviceAccount:
  annotations: {}
  # The bridge never calls the Kubernetes API (all cluster reads go through
  # flux-operator-mcp), so no token is mounted.
  automount: false
  # Create a dedicated ServiceAccount for the bridge.
  create: true
  # Override the generated name.
  name: ""

# Prometheus Operator ServiceMonitor. Off by default — VictoriaMetrics users
# can define their own VMServiceScrape outside the chart pointing at the
# bridge Service's `http` port + `/metrics` path.
serviceMonitor:
  enabled: false
  # namespace: monitoring        # default: render in release namespace
  # labels: {}                   # extra labels for Prom-Operator selector
  interval: 30s
  scrapeTimeout: 10s

# ─── Skills system ──────────────────────────────────────────────────────────
#
# The bridge inlines a SKILL.md prompt-prefix into every LLM call. The chart
# composes its content from up to two sources:
#
#   - default.enabled (default true): the bundled skill content (inlined in
#     templates/configmap-skill.yaml), a deduped distillation of Flux MCP
#     guidance + troubleshooting patterns scoped to the bridge's
#     diagnostician role.
#   - custom: a multi-line string. When default.enabled is also true, this
#     is appended after the bundled content. When default.enabled is false,
#     this becomes the entire skill prompt.
#
# When both are empty the ConfigMap is still rendered, with an empty SKILL.md,
# and the LLM gets no skill prefix.
skill:
  # Operator-supplied skill content. Multi-line YAML string; appended to (or
  # replaces) the bundled SKILL.md. Examples:
  #
  # custom: |
  #   ## Local conventions
  #   - All HelmReleases in this org go through the platform team's chart
  #     registry at oci://registry.internal/charts/.
  #   - Treat any condition mentioning "policy violation" as a Kyverno
  #     enforcement; the fix is usually in the manifest, not the policy.
  custom: ""
  default:
    enabled: true

# Holds the liveness probe until the bridge serves /healthz once. Startup
# connects to dependencies before the HTTP server listens: the MCP server
# (up to 30s), the dedupe Redis/Valkey (up to 5s) and GitHub's App lookup (up
# to 10s). On a fresh install those start at the same time, and without this
# probe the liveness probe would restart the bridge before it ever listens.
# 24 × 5s allows two minutes.
startupProbe:
  failureThreshold: 24
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 5
  timeoutSeconds: 3

# Pod termination grace period. Leaves headroom above the bridge's 30s
# shutdown budget (config.shutdownTimeout); raise both together.
terminationGracePeriodSeconds: 45

tolerations: []

volumeMounts: []

volumes: []

# ─── Optional bundled flux-operator-mcp sub-chart ────────────────────────────
#
# The bridge needs an MCP server to query for cluster state. The sub-chart
# provisions one alongside the bridge so a fresh `helm install` works
# self-contained. The defaults match what the bridge expects:
#
#   - transport: http     — matches the URL scheme in config.mcp.url
#   - readonly: true      — the bridge only reads; never grant write tools
#   - networkPolicy.create: true — MCP speaks unauthenticated HTTP, so only
#     the release namespace (where the bridge runs) may connect; add more
#     via networkPolicy.ingress.namespaces
#   - rbac.create: false  — the sub-chart would bind cluster-admin; the
#     bridge chart binds a read-only ClusterRole instead (see mcpRbac)
#
# Enabled by default so a fresh install works out of the box (also used by
# e2e). Set `enabled: false` if you already run flux-operator-mcp yourself
# and want to avoid a duplicate Deployment — then point `config.mcp.url`
# at your existing Service.
flux-operator-mcp:
  enabled: true
  # Pin the Service name to "flux-operator-mcp" regardless of release name.
  # The bridge derives its default MCP URL (and the mcpRbac subject) from
  # this name. Mirrors the ollama sub-chart pattern below.
  fullnameOverride: flux-operator-mcp
  networkPolicy:
    create: true
    ingress:
      namespaces: []
  rbac:
    create: false
  readonly: true
  transport: http

# ─── Optional bundled local LLM (otwld/ollama-helm) ─────────────────────────
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │ ⚠  THE BUNDLED OLLAMA CONFIG IS A "RUNS AT ALL" DEFAULT, NOT A         │
# │    PRODUCTION RECOMMENDATION.                                           │
# │                                                                         │
# │ The default model (qwen2.5-coder:1.5b) is chosen so `helm install`     │
# │ produces a working bridge on any host — zero credentials, ~1.5 GB RAM   │
# │ footprint, runs on CPU. Output quality is substantially worse than     │
# │ Anthropic Claude or Azure OpenAI Service: the model frequently breaks   │
# │ the deterministic comment structure SKILL.md prescribes, hallucinates   │
# │ resource names, and skips the failure-context citations PR reviewers    │
# │ rely on. Comments are still readable but visibly lower-quality.         │
# │                                                                         │
# │ Use the bundled Ollama for:                                             │
# │   - Local development / smoke-testing the install path                  │
# │   - CI / e2e tests that want zero external dependencies                 │
# │   - Air-gapped deployments where external LLM APIs aren't reachable     │
# │                                                                         │
# │ For production PR-comment quality, prefer one of:                       │
# │   - Anthropic Claude:    config.llm.provider=claude (Sonnet/Opus)       │
# │   - Azure OpenAI Service: config.llm.provider=openai-compatible         │
# │   - OpenAI direct:        config.llm.provider=openai-compatible         │
# │                                                                         │
# │ If you must use local Ollama in production, step up to qwen2.5-coder:7b │
# │ (8 GB RAM) at a minimum; 14B (16 GB) approaches Claude Haiku quality;   │
# │ 32B (32 GB) approaches Claude Sonnet. See docs/local-llm.md.           │
# └─────────────────────────────────────────────────────────────────────────┘
#
# When ollama.enabled=true, the upstream otwld/ollama-helm sub-chart is
# rendered alongside the bridge and, with config.llm.openaiBaseUrl empty, the
# bridge's OPENAI_BASE_URL points at it. The provider is NOT switched for you:
# set config.llm.provider=openai-compatible (and config.llm.model, matching
# ollama.ollama.models.pull/run) — with the default "none" Ollama runs unused.
ollama:
  # Whether to install the bundled Ollama sub-chart. Disabled by default
  # so chart install + chart-testing run on minimally-sized CI runners
  # (the qwen2.5-coder image alone exceeds typical GitHub-runner memory).
  # Enable for local-only smoke-testing and air-gapped installs — for
  # production switch config.llm.provider to "claude" (with
  # credentials.anthropicApiKey) or "openai-compatible" with a real
  # endpoint URL + key. See the warning above.
  enabled: false
  # Bump Ollama's default context window so the SKILL.md system prompt
  # (~5k tokens) plus the per-event user payload (Kustomization YAML +
  # readiness rows + failure context can reach 10-15k tokens) actually fit.
  # Ollama's hard-coded default is 4k on CPU hosts — too small; SKILL.md
  # gets evicted and the model effectively never sees the format spec,
  # which is the #1 cause of malformed PR comments on small local models.
  # 16k strikes a balance; bump to 32k if your model card supports it and
  # you're running 7B+ where the extra context actually helps.
  extraEnv:
    - name: OLLAMA_CONTEXT_LENGTH
      value: "16384"
  # Make the Service name predictable so the bridge can auto-derive the URL.
  fullnameOverride: ollama
  # Deploy Ollama into a different namespace than the bridge release.
  # Leave empty to share the bridge's namespace (default helm sub-chart
  # behavior). When set, you must pre-create the namespace yourself — helm
  # won't create namespaces for sub-chart resources. The bridge's
  # OPENAI_BASE_URL auto-derive picks up this value, so callers don't need
  # to override the URL separately.
  namespaceOverride: ""
  # Default model — small, code-tuned, CPU-friendly (~1 GB on disk, ~1.5 GB RAM loaded).
  # Override by setting ollama.ollama.models.pull and ollama.ollama.models.run.
  # See docs/local-llm.md for the model-size vs output-quality trade-off; the
  # 1.5B default produces compact but often format-breaking comments because
  # small models struggle with the structured SKILL.md template. 7B is the
  # practical floor for reliable formatting; 14B/32B match Anthropic Haiku /
  # Sonnet quality on this workload at the cost of RAM.
  ollama:
    models:
      pull:
        - qwen2.5-coder:1.5b
      run:
        - qwen2.5-coder:1.5b
  # Persistence is OFF by default — model gets re-pulled on every pod restart.
  # For production, set persistentVolume.enabled=true and configure storageClass
  # appropriately (see docs/local-llm.md).
  persistentVolume:
    enabled: false

# ─── Optional bundled Valkey sub-chart (dedupe persistence) ──────────────────
#
# Optional bundled Valkey for persistent dedupe state. Valkey speaks the
# Redis wire protocol so anything Redis-compatible (managed ElastiCache,
# Memorystore, self-hosted Redis) works as a drop-in via config.dedupe.persistence.url
# — the chart just bundles Valkey as a convenience for self-contained installs.
#
# When valkey.enabled=true, the upstream valkey-helm sub-chart is rendered and
# the bridge auto-wires config.dedupe.persistence.url at the in-cluster Service.
# When valkey.enabled=false but config.dedupe.persistence.url is set, the bridge
# connects to the external endpoint (Redis, ElastiCache, Memorystore, etc.) —
# the bundled sub-chart is just a convenience for self-contained installs.
#
# Enabled by default, together with config.dedupe.persistence.enabled. Set
# both to false for in-memory dedupe.
#
# The default is a single Valkey pod without Sentinel, which is enough for
# dedupe state. It is a single point of failure, though: while it is down,
# dedupe fails closed and the bridge skips events, also with several bridge
# replicas. For high availability, use the Sentinel setup instead:
# replica.enabled, sentinel.enabled, persistence and sentinel.password here,
# plus config.dedupe.persistence.sentinel.enabled with the same password.
valkey:
  # Auth off by default — the Valkey Pod is only reachable from inside the
  # cluster (ClusterIP Service). If you want auth, enable it here AND set
  # config.dedupe.persistence.password (or existingSecret).
  auth:
    enabled: false
  enabled: true
  # limits:
  #   memory: 128Mi
  # requests:
  #   cpu: 50m
  #   memory: 64Mi
  # Raw config appended to the sub-chart's generated valkey.conf.
  #
  # The eviction policy is the one setting you MUST NOT get wrong. The bridge's
  # long-lived keyspaces (blobrefs:, last-comment:, dedupe marks, …) only
  # expire after config.dedupe.persistence.maxTTL (30 days), so the dataset
  # can still reach maxmemory within that window. With the Redis/Valkey
  # DEFAULT policy (`noeviction`) writes start FAILING at the cap — and the
  # bridge's dedupe SETNX is fail-closed on a write error, so it would
  # silently stop processing events (drop every PR comment) until enough
  # keys expire.
  # `allkeys-lru` instead trims the coldest keys: an evicted cache key costs
  # one extra upstream fetch, an evicted dedupe key re-admits one event (a
  # possible duplicate comment, absorbed by idempotent delivery) — both
  # harmless. ALWAYS run allkeys-lru. See docs/caching.md → "Sizing your Redis".
  #
  # maxmemory is left to the server default here (bounded by the Pod memory
  # limit below). If you set a Pod memory limit, also set maxmemory to ~75% of
  # it so Valkey trims gracefully before the kernel OOM-kills the Pod — e.g.
  # for a 128Mi limit, `maxmemory 96mb`. The bridge dataset is small (typically
  # single-digit MB), so this is headroom-for-safety, not a tight fit.
  extraConfig: |
    maxmemory-policy allkeys-lru
    # maxmemory 96mb   # uncomment + size to ~75% of resources.limits.memory
  # Pin the Service name so config.dedupe.persistence.url auto-derivation
  # (in templates/deployment.yaml) hits a stable target regardless of the
  # parent release name.
  fullnameOverride: valkey
  # One pod is enough for dedupe state. Replication only gives high
  # availability together with Sentinel (sentinel.enabled, see above);
  # without Sentinel there is no failover.
  replica:
    enabled: false
  # Pod resources. The bridge's working set is small; the default below
  # comfortably holds it. If you lower the memory limit, set `maxmemory` in
  # extraConfig to ~75% of it (see above).
  resources:
