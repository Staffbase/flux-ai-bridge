{{- if not .Values.existingSecret }}
{{- /*
GitHub auth is App-only. Empty values render an empty Secret — the bridge
fails at startup with a clear error rather than blocking `helm template`.
Operators iterating on the chart can render with defaults; runtime config
is validated at the bridge boundary.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flux-ai-bridge.fullname" . }}
  labels:
    {{- include "flux-ai-bridge.labels" . | nindent 4 }}
type: Opaque
stringData:
  GITHUB_APP_ID: {{ .Values.credentials.githubApp.appId | quote }}
  GITHUB_APP_INSTALLATION_ID: {{ .Values.credentials.githubApp.installationId | quote }}
  GITHUB_APP_PRIVATE_KEY: |
    {{- .Values.credentials.githubApp.privateKey | nindent 4 }}
  {{- if eq .Values.config.llm.provider "claude" }}
  ANTHROPIC_API_KEY: {{ .Values.credentials.anthropicApiKey | quote }}
  {{- end }}
  {{- if eq .Values.config.llm.provider "openai-compatible" }}
  OPENAI_API_KEY: {{ .Values.credentials.openaiApiKey | quote }}
  {{- end }}
{{- end }}
