{{- /*
Secret holding the dedupe persistence passwords. Only rendered when:
  - dedupe persistence is enabled,
  - the user supplied at least one inline password (Redis backend or
    sentinel daemon) via config.dedupe.persistence.{password,sentinel.password},
  - and they did NOT also point at an existingSecret.
For an existingSecret the user is responsible for providing the keys
themselves; the chart wires them in via passwordKey / sentinel.passwordKey
(see deployment.yaml).
The bundled Valkey sub-chart ships auth.enabled=false by default, so this
Secret is typically only rendered when pointing at an external Redis-family
service (single-node or sentinel HA) with auth on.
The Redis ACL username (when used) is injected as a plain pod env var
directly from config.dedupe.persistence.user — usernames are not secrets,
so they don't belong in this Secret. Same applies to the sentinel-daemon
username (sentinel.user).
*/ -}}
{{- $sentinel := .Values.config.dedupe.persistence.sentinel | default dict }}
{{- $haveInlinePassword := or .Values.config.dedupe.persistence.password (and $sentinel.enabled $sentinel.password) }}
{{- if and .Values.config.dedupe.persistence.enabled
           $haveInlinePassword
           (not .Values.config.dedupe.persistence.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flux-ai-bridge.fullname" . }}-dedupe
  labels:
    {{- include "flux-ai-bridge.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.config.dedupe.persistence.password }}
  DEDUPE_PERSISTENCE_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- if $sentinel.enabled }}
    {{- with $sentinel.password }}
  DEDUPE_PERSISTENCE_SENTINEL_PASSWORD: {{ . | quote }}
    {{- end }}
  {{- end }}
{{- end }}
