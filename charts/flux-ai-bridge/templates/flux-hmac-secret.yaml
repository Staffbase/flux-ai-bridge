{{- /*
Webhook HMAC token Secret, for the "inline" and "generate" modes (see the
hmacMode helper). Two consumers read the same `token` key:
  - the bridge pod (WEBHOOK_HMAC_SECRET), in the release namespace;
  - the Flux Provider (secretRef), in the notification namespace.
A Secret can't be referenced across namespaces, so when the two differ the
token is rendered into both — from a single variable, so they always match.

The token comes from the hmacToken helper: generated tokens are reused from
the existing release-namespace Secret via `lookup`, so upgrades don't rotate
them. `helm template` and client-side dry-runs have no cluster access and
draw a fresh token on every render; the Deployment's checksum follows it, so
the bridge restarts with the new token instead of rejecting Flux's webhooks.
GitOps tools that render that way (e.g. Argo CD) should still set hmac.token
or hmac.existingSecret, or every sync rotates the token and restarts the pod.
*/ -}}
{{- $mode := include "flux-ai-bridge.hmacMode" . }}
{{- if or (eq $mode "inline") (eq $mode "generate") }}
{{- $name := include "flux-ai-bridge.hmacSecretName" . }}
{{- $token := include "flux-ai-bridge.hmacToken" . }}
{{- $namespaces := list .Release.Namespace }}
{{- $notificationNs := include "flux-ai-bridge.notificationNamespace" . }}
{{- if and .Values.flux.notification.enabled (ne $notificationNs .Release.Namespace) }}
{{- $namespaces = append $namespaces $notificationNs }}
{{- end }}
{{- range $namespaces }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ . }}
  labels:
    {{- include "flux-ai-bridge.labels" $ | nindent 4 }}
type: Opaque
stringData:
  token: {{ $token | quote }}
{{- end }}
{{- end }}
