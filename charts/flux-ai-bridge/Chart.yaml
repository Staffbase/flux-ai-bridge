apiVersion: v2
name: flux-ai-bridge
description: >
  A Kubernetes webhook service that receives Flux Notification Controller events,
  queries flux-operator-mcp for namespace resource status, and posts AI-generated
  deployment status comments to the originating GitHub PR using Claude or any OpenAI-compatible LLM.
type: application
version: 0.10.0
appVersion: "v0.10.0"
keywords:
  - flux
  - fluxcd
  - gitops
  - ai
  - llm
  - mcp
  - github
  - kubernetes
home: https://github.com/staffbase/flux-ai-bridge
sources:
  - https://github.com/staffbase/flux-ai-bridge
maintainers:
  - name: product-core-infra
    email: product-core-infra@staffbase.com
dependencies:
  - name: ollama
    version: "1.96.0"
    repository: https://helm.otwld.com/
    condition: ollama.enabled
  - name: flux-operator-mcp
    version: "0.63.1"
    repository: oci://ghcr.io/controlplaneio-fluxcd/charts
    condition: flux-operator-mcp.enabled
  - name: valkey
    version: "1.0.0"
    repository: oci://ghcr.io/valkey-io/valkey-helm
    condition: valkey.enabled
