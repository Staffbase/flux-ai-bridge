name: Release Helm Charts

permissions: {}

on:
  push:
    branches:
      - main
    paths:
      - 'charts/**/**'
  # Called by the ci workflow after an app release pushed its image, to
  # release a chart that was waiting for that image.
  workflow_call:
  # Fallback when that run failed; skip_existing makes reruns safe.
  workflow_dispatch:

env:
  helm-version: "v4.3.2"

jobs:
  # The chart installs the image of its appVersion by default. A chart that
  # names an unpublished image waits: publishing that app release builds the
  # image and runs this workflow again.
  image:
    name: Check the chart's image
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    outputs:
      published: ${{ steps.check.outputs.published }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # After an app release, the chart on main, not the one at the tag.
          ref: ${{ github.event.repository.default_branch }}

      - name: Check that the image is published
        id: check
        run: |
          image="ghcr.io/staffbase/flux-ai-bridge:$(yq '.appVersion' charts/flux-ai-bridge/Chart.yaml)"
          if out=$(docker manifest inspect "$image" 2>&1); then
            echo 'published=true' >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          elif echo "$out" | grep -q 'manifest unknown'; then
            echo "::notice title=Chart release waits for its image::$image isn't published yet. Publishing that app release releases the chart."
          else
            echo "$out"
            exit 1
          fi

  release:
    needs: image
    if: needs.image.outputs.published == 'true'
    # Merging a chart change and publishing an app release can run this at
    # the same time.
    concurrency:
      group: helm-release
      cancel-in-progress: false
    permissions:
      contents: write # to create the chart's GitHub release (helm/chart-releaser-action)
      packages: write # to push the chart to GHCR
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The commit the image check read: main may have moved since.
          ref: ${{ needs.image.outputs.sha }}

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: "${{ env.helm-version }}"

      # chart-releaser builds the chart dependencies while packaging; the
      # non-OCI sub-chart repositories must be known to Helm for that.
      - name: Add Helm dependency repositories
        run: |
          helm repo add ollama https://helm.otwld.com/
          helm repo update

      # chart-releaser starts each chart release's notes with this file from
      # the chart package instead of the chart description, which describes
      # the app. Written here, not kept in git: the notes name the version.
      - name: Write the chart release notes
        run: |
          chart=charts/flux-ai-bridge
          version=$(yq '.version' "$chart/Chart.yaml")
          app_version=$(yq '.appVersion' "$chart/Chart.yaml")
          {
            echo "Helm chart for flux-ai-bridge, chart version $version. It installs the image \`ghcr.io/staffbase/flux-ai-bridge:$app_version\` by default."
            echo
            echo "OCI artifact: [\`oci://ghcr.io/staffbase/charts/flux-ai-bridge:$version\`](https://github.com/orgs/Staffbase/packages/container/package/charts%2Fflux-ai-bridge)"
            echo
            echo '```bash'
            echo "helm install flux-ai-bridge oci://ghcr.io/staffbase/charts/flux-ai-bridge --version $version"
            echo '```'
          } > "$chart/RELEASE-NOTES.md"

      - name: Run chart-releaser
        id: chart-releaser
        uses: helm/chart-releaser-action@92c6b97fa9f664492a2592e0d1d80bc6bf378957 # v1.9.0
        env:
          CR_GENERATE_RELEASE_NOTES: true
          CR_RELEASE_NOTES_FILE: RELEASE-NOTES.md
          # Registry credentials for `cr push`, read from the environment so
          # the token isn't passed on the command line.
          CR_PASSWORD: "${{ secrets.GITHUB_TOKEN }}"
          CR_USERNAME: "${{ github.actor }}"
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          # Package this chart on every run instead of diffing against the
          # last tag: a run after an app release has no chart change to find.
          # skip_existing makes an already released chart version a no-op.
          charts: charts/flux-ai-bridge
          oci_registry_url: "oci://ghcr.io/staffbase/charts"
          # Chart releases share the repository with the app's v* releases;
          # keep the app release marked as latest.
          mark_as_latest: false
          # Lets a rerun recover from a failed OCI push: the existing GitHub
          # release is skipped and only missing chart versions are pushed.
          skip_existing: true
          # Publish to the OCI registry only. This skips the gh-pages index
          # update; the GitHub release per chart version is still created.
          skip_upload: true
