name: 'Close stale issues and PRs'
on:
  schedule:
    - cron: '30 1 * * *'

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11
        with:
          stale-issue-message: 'This issue has had no activity for 60 days and is marked stale. It will be closed in 7 days unless there is new activity.'
          stale-pr-message: 'This pull request has had no activity for 60 days and is marked stale. It will be closed in 7 days unless there is new activity.'
